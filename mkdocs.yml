site_name: Erick Pinango | Portfolio
site_url: https://ejpinangog.github.io
site_author: Erick Pinango
site_description: Technical Lead, SRE, DevOps, Platform & Hybrid Cloud Architecture Portfolio

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

 
nav:
  - Home: index.md
  - Competency Matrix: skills-matrix.md
  - Resume:
      - Lean Resume: resume.md
      - Extended Resume: extended-resume.md
  - Code Blueprints:
      - Overview: code-blueprints/index.md
extra:
  analytics:
    provider: google
    property: G-1H6SX8C3DJ
